<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Airbnb workflow map for expanded GPT-6 Astra access</title>
  <desc id="d">A warm editorial map showing OpenAI models connecting product, engineering, search, fraud, support, and claims workflows.</desc>
  <rect width="1600" height="900" fill="#fff4ea"/>
  <path d="M0 730C310 585 520 865 805 710s510-50 795-180V900H0Z" fill="#ffd4bf"/>
  <circle cx="270" cy="230" r="145" fill="#ff655b"/><circle cx="270" cy="230" r="74" fill="#fff4ea"/>
  <text x="500" y="105" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#302520">Frontier models enter more</text>
  <text x="500" y="158" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#302520">Airbnb workflows</text>
  <text x="505" y="200" font-family="Arial, sans-serif" font-size="22" fill="#6c5146">Expanded access covers engineering and product teams through APIs and Amazon Bedrock.</text>
  <g fill="none" stroke="#ff655b" stroke-width="7" stroke-linecap="round">
    <path d="M435 310C590 220 690 250 825 335"/><path d="M435 355C610 430 690 500 820 510"/><path d="M433 397C575 595 690 665 820 685"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="175" y="470" width="300" height="150" rx="30" fill="#302520"/>
    <text x="215" y="525" font-size="27" font-weight="700" fill="white">Model access</text>
    <text x="215" y="567" font-size="21" fill="#ffd4bf">GPT-6 Astra + other models</text>
    <text x="215" y="600" font-size="21" fill="#ffd4bf">OpenAI API · Bedrock</text>
    <g transform="translate(830 255)">
      <rect width="280" height="150" rx="28" fill="white" stroke="#ff655b" stroke-width="5"/>
      <text x="32" y="55" font-size="27" font-weight="700" fill="#302520">Engineering</text>
      <text x="32" y="97" font-size="21" fill="#6c5146">remote coding agents</text><text x="32" y="128" font-size="21" fill="#6c5146">internal assistant</text>
    </g>
    <g transform="translate(830 435)">
      <rect width="280" height="150" rx="28" fill="white" stroke="#ff9a70" stroke-width="5"/>
      <text x="32" y="55" font-size="27" font-weight="700" fill="#302520">Marketplace</text>
      <text x="32" y="97" font-size="21" fill="#6c5146">search · fraud</text><text x="32" y="128" font-size="21" fill="#6c5146">product experiences</text>
    </g>
    <g transform="translate(830 615)">
      <rect width="280" height="150" rx="28" fill="white" stroke="#c54c86" stroke-width="5"/>
      <text x="32" y="55" font-size="27" font-weight="700" fill="#302520">Operations</text>
      <text x="32" y="97" font-size="21" fill="#6c5146">support</text><text x="32" y="128" font-size="21" fill="#6c5146">insurance claims</text>
    </g>
  </g>
  <g transform="translate(1200 280)">
    <path d="M55 245V72c0-42 34-72 76-72h94c42 0 76 30 76 72v173" fill="#302520"/>
    <rect y="220" width="360" height="260" rx="34" fill="#302520"/>
    <text x="40" y="290" font-family="Arial" font-size="24" font-weight="700" fill="white">Company-reported change</text>
    <text x="40" y="365" font-family="Georgia" font-size="62" font-weight="700" fill="#ff9a70">~80%</text>
    <text x="40" y="405" font-family="Arial" font-size="21" fill="#ffe5d8">more features shipped</text>
    <text x="40" y="438" font-family="Arial" font-size="21" fill="#ffe5d8">than one year earlier</text>
  </g>
  <text x="505" y="842" font-family="Arial" font-size="20" fill="#6c5146">The 80% figure is Airbnb’s comparison; the announcement does not isolate how much is attributable to any one model.</text>
</svg>
