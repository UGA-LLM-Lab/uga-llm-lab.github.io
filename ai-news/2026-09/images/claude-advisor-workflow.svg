<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#f6f4ef"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#18202a}</style><rect width="8" height="560" fill="#a71930"/><text x="44" y="65" font-size="29" font-weight="700">Around an advisor’s working day</text><text x="44" y="103" font-size="18">Client data → drafts and tasks → advisor review</text><rect x="38" y="138" width="885" height="105" rx="8" fill="white"/><text x="62" y="180" font-size="25" fill="#a71930">01</text><text x="245" y="176" font-size="23" font-weight="700">Before the meeting</text><text x="245" y="213" font-size="18">Assemble records from connected systems</text><rect x="38" y="263" width="885" height="105" rx="8" fill="white"/><text x="62" y="305" font-size="25" fill="#a71930">02</text><text x="245" y="301" font-size="23" font-weight="700">After the meeting</text><text x="245" y="338" font-size="18">Prepare notes, follow-up drafts and tasks</text><rect x="38" y="388" width="885" height="105" rx="8" fill="white"/><text x="62" y="430" font-size="25" fill="#a71930">03</text><text x="245" y="426" font-size="23" font-weight="700">Review and approval</text><text x="245" y="463" font-size="18">Advisor oversight; administrative audit logs</text></svg>