<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four oversight layers in the September 29 voluntary AI safety accord</title>
  <desc id="desc">A factual editorial diagram showing internal controls, internal oversight, independent external audit, and board review. The agreement is voluntary and implementation details remain pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a32"/><stop offset="1" stop-color="#17355c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="100" r="220" fill="#2d5e96" opacity=".22"/>
  <circle cx="160" cy="820" r="260" fill="#0d7b78" opacity=".18"/>
  <text x="110" y="122" fill="#9fd7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">SEPTEMBER 29, 2026 · U.S. AI GOVERNANCE</text>
  <text x="110" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="700">A voluntary AI safety accord</text>
  <text x="110" y="260" fill="#d3e5f7" font-family="Arial, sans-serif" font-size="28">Four reported oversight layers — commitments, not yet enforceable rules</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(110 340)"><rect width="315" height="300" rx="26" fill="#ffffff"/><circle cx="58" cy="62" r="31" fill="#146b9f"/><text x="58" y="73" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">1</text><text x="34" y="132" fill="#102844" font-size="30" font-weight="700">Internal controls</text><text x="34" y="180" fill="#3d5068" font-size="23"><tspan x="34" dy="0">Policies, access limits</tspan><tspan x="34" dy="34">and technical checks</tspan><tspan x="34" dy="34">inside the developer</tspan></text></g>
    <g transform="translate(465 340)"><rect width="315" height="300" rx="26" fill="#ffffff"/><circle cx="58" cy="62" r="31" fill="#167c78"/><text x="58" y="73" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">2</text><text x="34" y="132" fill="#102844" font-size="30" font-weight="700">Internal oversight</text><text x="34" y="180" fill="#3d5068" font-size="23"><tspan x="34" dy="0">Dedicated teams</tspan><tspan x="34" dy="34">reviewing model and</tspan><tspan x="34" dy="34">system risk</tspan></text></g>
    <g transform="translate(820 340)"><rect width="315" height="300" rx="26" fill="#ffffff"/><circle cx="58" cy="62" r="31" fill="#7b5aa6"/><text x="58" y="73" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">3</text><text x="34" y="132" fill="#102844" font-size="30" font-weight="700">External audit</text><text x="34" y="180" fill="#3d5068" font-size="23"><tspan x="34" dy="0">Independent reviewers</tspan><tspan x="34" dy="34">testing whether systems</tspan><tspan x="34" dy="34">behave as intended</tspan></text></g>
    <g transform="translate(1175 340)"><rect width="315" height="300" rx="26" fill="#ffffff"/><circle cx="58" cy="62" r="31" fill="#b25f38"/><text x="58" y="73" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">4</text><text x="34" y="132" fill="#102844" font-size="30" font-weight="700">Board review</text><text x="34" y="180" fill="#3d5068" font-size="23"><tspan x="34" dy="0">Senior accountability</tspan><tspan x="34" dy="34">for controls, findings</tspan><tspan x="34" dy="34">and remediation</tspan></text></g>
  </g>
  <rect x="110" y="700" width="1380" height="96" rx="20" fill="#091427" opacity=".78"/>
  <text x="145" y="743" fill="#ffd39f" font-family="Arial, sans-serif" font-size="25" font-weight="700">WHAT IS STILL UNKNOWN</text>
  <text x="145" y="778" fill="#eaf3fc" font-family="Arial, sans-serif" font-size="22">Legal penalties · audit independence rules · public reporting cadence · final implementation timetable</text>
  <text x="1490" y="850" text-anchor="end" fill="#9fb4ca" font-family="Arial, sans-serif" font-size="20">UGA LLM Lab · factual editorial graphic</text>
</svg>
