<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">One Claude conversation, three creation tools</title><desc id="desc">An editorial diagram connects a conversation to Docs for collaborative documents, Slides for presentations, and Design for visual work. All three creation tools are in beta on paid plans.</desc>
<rect width="1200" height="680" fill="#f7f4ed"/>
<g font-family="Arial, sans-serif" fill="#242422"><text x="68" y="84" font-size="20" letter-spacing="3" fill="#795c4b">PRODUCT UPDATE · SEPTEMBER 16, 2026</text><text x="68" y="156" font-size="48" font-weight="700">One conversation. More than chat.</text>
<rect x="360" y="216" width="480" height="94" rx="18" fill="#d97856"/><text x="600" y="274" text-anchor="middle" font-size="31" fill="white">Claude conversation</text>
<path d="M600 310 V360 M226 360 H974 M226 360 V400 M600 360 V400 M974 360 V400" fill="none" stroke="#b3a99b" stroke-width="4"/>
<g fill="#fff" stroke="#d9d1c4" stroke-width="2"><rect x="66" y="400" width="320" height="160" rx="18"/><rect x="440" y="400" width="320" height="160" rx="18"/><rect x="814" y="400" width="320" height="160" rx="18"/></g>
<g text-anchor="middle"><text x="226" y="450" font-size="32" font-weight="700">Docs</text><text x="226" y="490" font-size="21">Write and edit together</text><text x="226" y="523" font-size="19" fill="#625e58">Word · PDF · Markdown</text><text x="600" y="450" font-size="32" font-weight="700">Slides</text><text x="600" y="490" font-size="21">Create presentations</text><text x="600" y="523" font-size="19" fill="#625e58">PowerPoint · PDF</text><text x="974" y="450" font-size="32" font-weight="700">Design</text><text x="974" y="490" font-size="21">Make visual work</text><text x="974" y="523" font-size="19" fill="#625e58">Inside the conversation</text></g>
<text x="68" y="622" font-size="19" fill="#625e58">Creation tools: beta on paid plans. Unified interface: staged rollout, Pro and Max first.</text><text x="68" y="655" font-size="15" fill="#796f65">Source: Anthropic announcement and Claude Help Center. Editorial diagram, not a product screenshot.</text></g></svg>
