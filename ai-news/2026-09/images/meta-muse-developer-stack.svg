<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Meta Muse developer stack</title>
  <desc id="d">A blueprint-style diagram of parallel Muse Code agents, isolated workspaces, tests, the Meta Model API and cloud distribution.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d4d71" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fd5ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#071625"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="58" width="1480" height="784" rx="12" fill="none" stroke="#3174a2" stroke-width="2"/>
  <text x="105" y="126" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="42" font-weight="700">MUSE CODE → MODEL API → DEPLOYMENT</text>
  <text x="108" y="170" fill="#72c8f4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21">CONNECT 2026 / DEVELOPER DELIVERY MAP</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="105" y="236" width="420" height="478" rx="10" fill="#0a2034" stroke="#4aa3d7" stroke-width="3"/>
    <text x="140" y="282" fill="#79d5ff" font-size="21" font-weight="700">01 / MUSE CODE</text>
    <text x="140" y="320" fill="#fff" font-size="27" font-weight="700">MULTI-AGENT BY DEFAULT</text>
    <g>
      <rect x="140" y="363" width="350" height="80" rx="8" fill="#102d46" stroke="#39b9ed"/><text x="165" y="396" fill="#a6e8ff" font-size="17">WORKER A / isolated</text><text x="165" y="424" fill="#fff" font-size="19">write implementation</text>
      <rect x="140" y="463" width="350" height="80" rx="8" fill="#102d46" stroke="#39b9ed"/><text x="165" y="496" fill="#a6e8ff" font-size="17">WORKER B / isolated</text><text x="165" y="524" fill="#fff" font-size="19">run tests + inspect</text>
      <rect x="140" y="563" width="350" height="80" rx="8" fill="#102d46" stroke="#39b9ed"/><text x="165" y="596" fill="#a6e8ff" font-size="17">WORKER C / isolated</text><text x="165" y="624" fill="#fff" font-size="19">try alternate path</text>
    </g>
    <text x="140" y="684" fill="#ffcf70" font-size="18">OUT OF BETA · WINDOWS ADDED</text>
    <path d="M550 475H675" stroke="#7fd5ff" stroke-width="5" marker-end="url(#a)"/>
    <rect x="690" y="313" width="320" height="325" rx="18" fill="#121c39" stroke="#786cff" stroke-width="4"/>
    <text x="850" y="365" text-anchor="middle" fill="#ada5ff" font-size="19" font-weight="700">02 / ACCESS</text>
    <circle cx="850" cy="464" r="72" fill="none" stroke="#887cff" stroke-width="10"/>
    <path d="M800 464h100M850 414v100" stroke="#d4d0ff" stroke-width="8"/>
    <text x="850" y="566" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">META MODEL API</text>
    <text x="850" y="602" text-anchor="middle" fill="#9fc9df" font-size="18">GENERAL AVAILABILITY · GLOBAL</text>
    <path d="M1030 475H1138" stroke="#7fd5ff" stroke-width="5" marker-end="url(#a)"/>
    <rect x="1155" y="236" width="335" height="478" rx="10" fill="#0a2034" stroke="#4aa3d7" stroke-width="3"/>
    <text x="1190" y="282" fill="#79d5ff" font-size="21" font-weight="700">03 / CHANNELS</text>
    <g font-size="21"><rect x="1190" y="342" width="265" height="78" rx="8" fill="#102d46"/><text x="1322" y="389" text-anchor="middle" fill="#fff">FIRST-PARTY API</text><rect x="1190" y="442" width="265" height="78" rx="8" fill="#102d46"/><text x="1322" y="489" text-anchor="middle" fill="#fff">ORACLE CLOUD</text><rect x="1190" y="542" width="265" height="78" rx="8" fill="#102d46"/><text x="1322" y="575" text-anchor="middle" fill="#fff">GOOGLE CLOUD</text><text x="1322" y="602" text-anchor="middle" fill="#ffcf70" font-size="16">PRIVATE PREVIEW</text></g>
    <text x="105" y="790" fill="#7fd5ff" font-size="20">SEPARATE MATURITY LEVELS:</text>
    <text x="430" y="790" fill="#fff" font-size="16">Code-tool release does not mean every model and partner route is generally available.</text>
  </g>
</svg>
