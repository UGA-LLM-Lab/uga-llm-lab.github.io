<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Claude Opus 5.5 performance and economics</title>
  <desc id="d">A magazine-style scorecard separating model context, output, pricing, speed, and evaluation claims.</desc>
  <rect width="1600" height="900" fill="#efe9ff"/>
  <circle cx="1395" cy="95" r="260" fill="#ff7c66" opacity=".9"/><circle cx="150" cy="830" r="260" fill="#5337a8" opacity=".92"/>
  <text x="90" y="105" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#241a44">Claude Opus 5.5</text>
  <text x="92" y="153" font-family="Arial, sans-serif" font-size="24" fill="#5a4b78">A launch scorecard: capacity, price, speed and evaluation evidence kept separate.</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="225" width="440" height="220" rx="36" fill="#241a44"/>
    <text x="135" y="285" font-size="24" font-weight="700" fill="#d8cfff">CONTEXT</text><text x="135" y="370" font-size="70" font-weight="700" fill="white">1M</text><text x="335" y="365" font-size="24" fill="#d8cfff">tokens</text><text x="135" y="410" font-size="21" fill="#d8cfff">128K maximum output</text>
    <rect x="570" y="225" width="440" height="220" rx="36" fill="white" stroke="#5337a8" stroke-width="5"/>
    <text x="615" y="285" font-size="24" font-weight="700" fill="#5337a8">API PRICE / 1M TOKENS</text><text x="615" y="365" font-size="58" font-weight="700" fill="#241a44">$4</text><text x="760" y="360" font-size="23" fill="#5a4b78">input</text><text x="850" y="365" font-size="58" font-weight="700" fill="#241a44">$20</text><text x="850" y="405" font-size="20" fill="#5a4b78">output</text>
    <rect x="1050" y="225" width="440" height="220" rx="36" fill="#ff7c66"/>
    <text x="1095" y="285" font-size="24" font-weight="700" fill="#241a44">COMPANY-REPORTED</text><text x="1095" y="365" font-size="62" font-weight="700" fill="#241a44">&gt;30%</text><text x="1315" y="360" font-size="23" fill="#241a44">faster</text><text x="1095" y="408" font-size="20" fill="#241a44">than Opus 5</text>
    <rect x="330" y="515" width="940" height="250" rx="42" fill="white"/>
    <text x="385" y="575" font-size="25" font-weight="700" fill="#241a44">EVALUATION LAYERS</text>
    <rect x="385" y="620" width="235" height="85" rx="20" fill="#dcd2ff"/><text x="420" y="656" font-size="21" font-weight="700" fill="#241a44">Vendor benchmarks</text><text x="420" y="685" font-size="18" fill="#5a4b78">coding · agents · work</text>
    <path d="M650 662H710" stroke="#5337a8" stroke-width="6"/><path d="M690 642L718 662 690 682" fill="none" stroke="#5337a8" stroke-width="6"/>
    <rect x="735" y="620" width="235" height="85" rx="20" fill="#ffd4cd"/><text x="770" y="656" font-size="21" font-weight="700" fill="#241a44">External testing</text><text x="770" y="685" font-size="18" fill="#5a4b78">Frontier Design · METR</text>
    <path d="M1000 662H1060" stroke="#ff7c66" stroke-width="6"/><path d="M1040 642L1068 662 1040 682" fill="none" stroke="#ff7c66" stroke-width="6"/>
    <rect x="1085" y="620" width="130" height="85" rx="20" fill="#241a44"/><text x="1115" y="656" font-size="20" font-weight="700" fill="white">Use-case</text><text x="1115" y="685" font-size="18" fill="#d8cfff">validation</text>
  </g>
  <text x="530" y="835" font-family="Arial" font-size="20" fill="#5a4b78">Benchmarks, speed and cost comparisons are not a single score; real workload validation remains necessary.</text>
</svg>
