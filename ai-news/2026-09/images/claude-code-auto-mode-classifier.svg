<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code auto mode server-side classifier flow</title>
  <desc id="desc">A three-step flow from a proposed action to a server-side classifier and then to an allowed or blocked result, with an uncharged classifier overhead note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151c"/>
      <stop offset="1" stop-color="#31283c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="190" fill="#d6a879" opacity="0.08"/>
  <circle cx="110" cy="620" r="260" fill="#8e72a6" opacity="0.10"/>
  <text x="76" y="92" fill="#f6f2ee" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">CLAUDE CODE 2.1.278</text>
  <text x="76" y="144" fill="#f6f2ee" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Auto mode moves its safety check to the server</text>
  <text x="76" y="187" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="23">Eligible sessions keep the check while removing classifier overhead charges.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="270" width="265" height="180" rx="24" fill="#25212c" stroke="#675b73" stroke-width="2"/>
    <rect x="468" y="270" width="265" height="180" rx="24" fill="#33293a" stroke="#d6a879" stroke-width="3"/>
    <rect x="860" y="270" width="265" height="180" rx="24" fill="#25212c" stroke="#675b73" stroke-width="2"/>
  </g>

  <text x="108" y="318" fill="#d6a879" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">01 · PROPOSE</text>
  <text x="108" y="365" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Agent action</text>
  <text x="108" y="402" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="20">Shell command</text>
  <text x="108" y="430" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="20">or network request</text>

  <text x="500" y="318" fill="#d6a879" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">02 · CHECK</text>
  <text x="500" y="365" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Server classifier</text>
  <text x="500" y="402" fill="#f1d8bd" font-family="Arial, Helvetica, sans-serif" font-size="20">Classifier overhead: $0</text>
  <text x="500" y="430" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="17">where supported</text>

  <text x="892" y="318" fill="#d6a879" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">03 · DECIDE</text>
  <text x="892" y="365" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Run or stop</text>
  <text x="892" y="402" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="20">Safety gate remains</text>
  <text x="892" y="430" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="20">in the action path</text>

  <path d="M355 360h91" stroke="#d6a879" stroke-width="5" stroke-linecap="round"/>
  <path d="M429 344l18 16-18 16" fill="none" stroke="#d6a879" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M747 360h91" stroke="#d6a879" stroke-width="5" stroke-linecap="round"/>
  <path d="M821 344l18 16-18 16" fill="none" stroke="#d6a879" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="76" y="520" width="1049" height="82" rx="18" fill="#1f1c25" stroke="#4c4355"/>
  <text x="108" y="557" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Fallback stays visible</text>
  <text x="108" y="584" fill="#cfc7d7" font-family="Arial, Helvetica, sans-serif" font-size="18">/status reports Enabled or Disabled; unsupported sessions warn before using the billed classifier path.</text>
  <text x="1125" y="642" text-anchor="end" fill="#887d91" font-family="Arial, Helvetica, sans-serif" font-size="15">Source: Anthropic release notes and documentation</text>
</svg>
