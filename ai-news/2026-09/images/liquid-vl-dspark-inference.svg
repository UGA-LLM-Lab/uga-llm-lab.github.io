  <g transform="translate(90 610)" font-family="Inter,Arial,sans-serif">
    <text fill="#102634" font-size="24" font-weight="800">LIQUID-REPORTED PEAKS</text>
    <rect y="48" width="680" height="98" rx="18" fill="#fff"/>
    <rect y="48" width="455" height="98" rx="18" fill="url(#g)"/>
