<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">LFM2.5-VL-DSpark inference pipeline</title>
  <desc id="d">A white technical diagram separating unchanged vision encoding and prefill from accelerated token drafting and target-model verification.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#152a39"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1db9a5"/><stop offset="1" stop-color="#75d65b"/></linearGradient></defs>
  <rect width="1600" height="900" fill="#f3f0e9"/>
  <text x="90" y="112" fill="#102634" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="760">WHERE DSPARK SPEEDS UP VISION-LANGUAGE INFERENCE</text>
  <text x="92" y="154" fill="#52636d" font-family="Inter,Arial,sans-serif" font-size="22">Experimental drafter for LFM2.5-VL-3B · Liquid AI · September 24, 2026</text>
