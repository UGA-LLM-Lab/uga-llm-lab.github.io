    <rect y="168" width="385" height="98" rx="18" fill="#2b8eb8"/>
    <text x="30" y="211" fill="#fff" font-size="22" font-weight="750">H100 DECODING</text><text x="30" y="244" fill="#fff" font-size="30" font-weight="850">up to 2.66×</text>
    <text x="700" y="212" fill="#52636d" font-size="20">end-to-end:</text><text x="830" y="212" fill="#102634" font-size="28" font-weight="800">up to 2.27×</text>
    <text x="1100" y="75" fill="#b45a38" font-size="20" font-weight="800">BOUNDARY</text><text x="1100" y="112" fill="#52636d" font-size="18">Speculation does not speed up</text><text x="1100" y="140" fill="#102634" font-size="22" font-weight="700">vision encoding or prefill.</text><text x="1100" y="190" fill="#52636d" font-size="18">Hardware, temperature, answer length</text><text x="1100" y="218" fill="#52636d" font-size="18">and concurrency change the gain.</text>
