    <text x="1105" y="48" text-anchor="middle" fill="#12816e" font-size="19" font-weight="800" letter-spacing="2">ACCELERATED DECODE</text>
    <rect x="935" y="88" width="150" height="108" rx="14" fill="#fff" stroke="#1db9a5" stroke-width="2"/><text x="1010" y="128" text-anchor="middle" fill="#102634" font-size="18" font-weight="700">279.5M</text><text x="1010" y="156" text-anchor="middle" fill="#52636d" font-size="16">draft model</text><text x="1010" y="181" text-anchor="middle" fill="#52636d" font-size="16">proposes block</text>
    <path d="M1096 143H1142" stroke="#152a39" stroke-width="4" marker-end="url(#a)"/>
    <rect x="1155" y="88" width="120" height="108" rx="14" fill="#102634"/><text x="1215" y="129" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3B</text><text x="1215" y="158" text-anchor="middle" fill="#d4e0e6" font-size="15">target</text><text x="1215" y="182" text-anchor="middle" fill="#d4e0e6" font-size="15">verifies</text>
    <text x="1105" y="238" text-anchor="middle" fill="#102634" font-size="18" font-weight="700">more accepted tokens per target pass</text>
    <text x="1105" y="266" text-anchor="middle" fill="#52636d" font-size="14">same output distribution under matched sampling</text>
