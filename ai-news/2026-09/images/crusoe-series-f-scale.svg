<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Crusoe Series F and infrastructure scale</title>
  <desc id="desc">Company-reported funding, valuation, contracted value, and power capacity figures from Crusoe's September 17 announcement.</desc>
  <rect width="1600" height="900" fill="#080b0d"/>
  <rect x="0" y="0" width="22" height="900" fill="#caff47"/>
  <text x="95" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="700">Crusoe funds the physical stack of AI</text>
  <text x="95" y="160" fill="#aab5bd" font-family="Arial, sans-serif" font-size="25">Initial closing announced September 17, 2026</text>
  <g font-family="Arial, sans-serif">
    <rect x="95" y="250" width="650" height="220" rx="28" fill="#caff47"/>
    <text x="140" y="350" fill="#111718" font-size="78" font-weight="700">$3.9B</text>
    <text x="140" y="415" fill="#354034" font-size="30">anticipated Series F</text>
    <rect x="855" y="250" width="650" height="220" rx="28" fill="#171d21" stroke="#59646c" stroke-width="2"/>
    <text x="900" y="350" fill="#ffffff" font-size="78" font-weight="700">$30.9B</text>
    <text x="900" y="415" fill="#aab5bd" font-size="30">post-money valuation</text>
    <rect x="95" y="550" width="430" height="190" rx="28" fill="#171d21" stroke="#59646c" stroke-width="2"/>
    <text x="135" y="635" fill="#caff47" font-size="62" font-weight="700">$140B+</text>
    <text x="135" y="692" fill="#aab5bd" font-size="25">contracted value*</text>
    <rect x="585" y="550" width="430" height="190" rx="28" fill="#171d21" stroke="#59646c" stroke-width="2"/>
    <text x="625" y="635" fill="#caff47" font-size="62" font-weight="700">6GW+</text>
    <text x="625" y="692" fill="#aab5bd" font-size="25">gross contracted capacity*</text>
    <rect x="1075" y="550" width="430" height="190" rx="28" fill="#171d21" stroke="#59646c" stroke-width="2"/>
    <text x="1115" y="635" fill="#caff47" font-size="62" font-weight="700">1GW</text>
    <text x="1115" y="692" fill="#aab5bd" font-size="25">delivered and operating*</text>
  </g>
  <text x="95" y="840" fill="#77838b" font-family="Arial, sans-serif" font-size="18">UGA LLM Lab graphic · Source: Crusoe · *Company-reported figures; contracted value is not current-year revenue</text>
</svg>
