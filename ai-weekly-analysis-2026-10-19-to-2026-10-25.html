<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Analysis · October 19–25, 2026</title><style>:root {
  --uga-red: #ba0c2f;
  --uga-red-dark: #8f0824;
  --ink: #171717;
  --ink-soft: #4f4f4f;
  --muted: #747474;
  --line: #dedede;
  --line-dark: #c8c8c8;
  --paper: #ffffff;
  --paper-soft: #f6f6f5;
  --paper-red: #faf1f3;
  --black: #090909;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shell: min(1160px, calc(100% - 40px));
  --radius: 8px;
  --shadow: 0 10px 28px rgba(18, 18, 18, 0.08);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body > main {
  width: 100%;
  flex: 1 0 auto;
}

body > [data-site-header],
body > [data-site-footer] {
  flex: 0 0 auto;
}

body.nav-open {
  overflow: hidden;
}

img,
svg {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
}

h1,
h2,
h3,
h4,
p,
ul,
ol {
  margin-top: 0;
}

h1,
h2,
h3,
h4 {
  line-height: 1.2;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease;
}

a:hover,
a:focus-visible {
  color: var(--uga-red);
}

:focus-visible {
  outline: 3px solid rgba(186, 12, 47, 0.26);
  outline-offset: 3px;
}

::selection {
  color: white;
  background: var(--uga-red);
}

.shell {
  width: var(--shell);
  margin-inline: auto;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 8px;
  left: 8px;
  padding: 8px 12px;
  color: white;
  background: var(--uga-red);
  transform: translateY(-150%);
}

.skip-link:focus {
  color: white;
  transform: translateY(0);
}

/* Shared header */
.site-header {
  position: sticky;
  z-index: 100;
  top: 0;
  background: rgba(255, 255, 255, 0.98);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

.brand-row {
  min-height: 72px;
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr) auto;
  align-items: center;
  gap: 22px;
}

.uga-brand {
  display: inline-flex;
  width: 158px;
  align-items: center;
}

.uga-brand img {
  width: 100%;
  height: auto;
}

.lab-brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 16px;
}

.lab-brand__main {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.lab-brand__main img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
}

.lab-brand__main span {
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.sponsor-line {
  padding-left: 16px;
  color: var(--ink-soft);
  border-left: 1px solid var(--line-dark);
  font-size: 0.96rem;
  white-space: nowrap;
}

.sponsor-line a {
  font-size: 1rem;
  font-weight: 750;
}

.menu-toggle {
  display: none;
  align-items: center;
  gap: 9px;
  padding: 8px 3px 8px 10px;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 700;
}

.menu-toggle i,
.menu-toggle i::before,
.menu-toggle i::after {
  display: block;
  width: 22px;
  height: 2px;
  background: currentColor;
  transition: transform 160ms ease;
}

.menu-toggle i {
  position: relative;
}

.menu-toggle i::before,
.menu-toggle i::after {
  content: "";
  position: absolute;
  left: 0;
}

.menu-toggle i::before {
  top: -6px;
}

.menu-toggle i::after {
  top: 6px;
}

.nav-open .menu-toggle i {
  background: transparent;
}

.nav-open .menu-toggle i::before {
  top: 0;
  transform: rotate(45deg);
}

.nav-open .menu-toggle i::after {
  top: 0;
  transform: rotate(-45deg);
}

.nav-wrap {
  border-top: 1px solid #ececec;
}

.primary-nav {
  overflow: visible;
}

.nav-list,
.dropdown-menu {
  padding: 0;
  margin: 0;
  list-style: none;
}

.nav-list {
  display: flex;
  align-items: stretch;
}

.nav-item {
  position: relative;
  flex: 1 1 0;
  min-width: 118px;
}

.nav-link {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 10px 6px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  font-size: 0.78rem;
  font-weight: 750;
  letter-spacing: 0.025em;
  text-align: center;
  text-transform: none;
  cursor: pointer;
}

.nav-link:hover,
.nav-link:focus-visible,
.nav-item.is-active > .nav-link,
.dropdown-trigger:hover > .nav-link,
.dropdown-trigger:focus-within > .nav-link,
.nav-item.is-active .dropdown-trigger > .nav-link {
  color: var(--uga-red);
  background: var(--paper-soft);
  border-bottom-color: var(--uga-red);
}

.nav-wordmark {
  width: 103px;
  height: 18px;
  display: grid;
  place-items: center;
}

.nav-wordmark img {
  width: 100%;
  max-height: 18px;
  object-fit: contain;
}

.nav-link--wordmark:hover .nav-wordmark,
.nav-link--wordmark:focus-visible .nav-wordmark,
.nav-item.is-active .nav-wordmark {
  background: transparent;
}

.dropdown-trigger {
  position: relative;
}

.dropdown-trigger > .nav-link {
  padding: 7px 34px 6px 8px;
}

.dropdown-toggle--separate {
  position: absolute;
  inset: 0 0 0 auto;
  width: 30px;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
}

.dropdown-trigger:hover > .dropdown-toggle--separate,
.dropdown-trigger:focus-within > .dropdown-toggle--separate,
.nav-item.is-active .dropdown-toggle--separate {
  color: var(--uga-red);
}

.dropdown-toggle--separate:focus-visible {
  outline: 2px solid var(--uga-red);
  outline-offset: -3px;
}

.dropdown-toggle svg {
  width: 10px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7;
  transition: transform 150ms ease;
}

.nav-item--dropdown:hover .dropdown-toggle svg,
.nav-item--dropdown:focus-within .dropdown-toggle svg,
.nav-item--dropdown.is-open .dropdown-toggle svg {
  transform: rotate(180deg);
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 1px);
  left: 50%;
  width: 240px;
  padding: 6px;
  background: white;
  border: 1px solid var(--line);
  border-top: 2px solid var(--uga-red);
  box-shadow: var(--shadow);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 5px);
  transition: opacity 140ms ease, transform 140ms ease, visibility 140ms ease;
}

.nav-item--dropdown:hover .dropdown-menu,
.nav-item--dropdown:focus-within .dropdown-menu,
.nav-item--dropdown.is-open .dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

.dropdown-link {
  display: block;
  padding: 9px 10px;
  border-radius: 4px;
  font-size: 0.84rem;
  font-weight: 600;
}

.dropdown-link:hover,
.dropdown-link:focus-visible,
.dropdown-link.is-active {
  color: var(--uga-red);
  background: var(--paper-red);
}

.dropdown-link--strong {
  font-weight: 850;
}

/* Shared content */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.76rem;
}

.breadcrumb span {
  color: var(--uga-red);
}

.page-heading {
  padding: 28px 0 24px;
  border-bottom: 1px solid var(--line);
}

.page-heading h1 {
  margin-bottom: 7px;
  font-family: var(--serif);
  font-size: clamp(1.8rem, 3.4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.03em;
}

.page-heading > p:last-child {
  /* Introductions use their container width; avoid fixed text-width caps. */
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.98rem;
}

.section {
  padding: 36px 0;
}

.section + .section {
  border-top: 1px solid var(--line);
}

.section--soft {
  background: var(--paper-soft);
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}

.section-heading h2 {
  margin-bottom: 0;
  font-family: var(--serif);
  font-size: 1.55rem;
  letter-spacing: -0.02em;
}

.section-heading p {
  max-width: 580px;
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.86rem;
  text-align: right;
}

.section-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
}

.section-bar h2,
.section-bar h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.25rem;
}

.button-row,
.quick-links,
.member-links,
.publication-jump {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.button {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 13px;
  color: white;
  background: var(--uga-red);
  border: 1px solid var(--uga-red);
  border-radius: 5px;
  font-size: 0.78rem;
  font-weight: 750;
}

.button:hover,
.button:focus-visible {
  color: white;
  background: var(--uga-red-dark);
  border-color: var(--uga-red-dark);
}

.button--outline {
  color: var(--ink);
  background: white;
  border-color: var(--line-dark);
}

.button--outline:hover,
.button--outline:focus-visible {
  color: var(--uga-red);
  background: var(--paper-red);
  border-color: var(--uga-red);
}

/* Home */
.home-intro {
  padding: 34px 0;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}

.home-intro__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.65fr);
  gap: 42px;
  align-items: start;
}

.home-intro h1 {
  max-width: 720px;
  margin-bottom: 2px;
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 3rem);
  letter-spacing: -0.04em;
}

.home-intro__lead {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 1rem;
}

.home-intro__lead a {
  font-weight: inherit;
}

.home-intro__lead strong {
  font-weight: 750;
}

.home-intro__summary {
  max-width: 760px;
  margin-bottom: 18px;
  color: var(--ink-soft);
  font-size: 0.96rem;
  line-height: 1.65;
}

.quick-links a {
  padding-bottom: 2px;
  border-bottom: 1px solid var(--line-dark);
  font-size: 0.8rem;
  font-weight: 700;
}

.home-social-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin-top: 13px;
}

.home-social-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.home-social-row > span {
  margin-right: 2px;
  color: var(--muted);
  font-size: 0.72rem;
}

.home-forum-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--line-dark);
  font-size: 0.76rem;
  font-weight: 700;
}

.social-link {
  width: 28px;
  height: 28px;
  display: inline-grid;
  flex: 0 0 auto;
  place-items: center;
  color: var(--ink-soft);
  border: 1px solid var(--line-dark);
  border-radius: 50%;
}

.social-link:hover,
.social-link:focus-visible {
  color: var(--uga-red);
  border-color: var(--uga-red);
}

.social-link svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7;
}

.social-link .social-icon-dot {
  fill: currentColor;
  stroke: none;
}

.focus-index {
  padding: 15px 17px;
  background: white;
  border: 1px solid var(--line);
  border-top: 3px solid var(--uga-red);
}

.focus-index h2 {
  margin-bottom: 8px;
  font-size: 0.78rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.focus-index ul {
  padding: 0;
  margin: 0;
  list-style: none;
}

.focus-index li + li {
  border-top: 1px solid var(--line);
}

.focus-index a {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  font-family: var(--serif);
  font-size: 0.98rem;
}

.mission-grid {
  display: grid;
  grid-template-columns: minmax(250px, 0.7fr) minmax(0, 1.3fr);
  gap: 42px;
}

.mission-copy h2 {
  margin-bottom: 8px;
  font-family: var(--serif);
  font-size: 1.5rem;
}

.mission-copy p {
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.mission-list {
  padding: 0;
  margin: 0;
  list-style: none;
}

.mission-list li {
  position: relative;
  display: block;
  min-width: 0;
  padding: 10px 0 10px 20px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.88rem;
  overflow-wrap: break-word;
  word-break: normal;
}

.mission-list li::before {
  content: "";
  position: absolute;
  top: 1.02em;
  left: 0;
  width: 5px;
  height: 5px;
  color: var(--uga-red);
  background: var(--uga-red);
  border-radius: 50%;
}

.news-list {
  border-top: 2px solid var(--ink);
}

.news-item {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.news-item.has-image {
  grid-template-columns: 92px 112px minmax(0, 1fr);
}

.news-item.has-logo {
  grid-template-columns: 92px 112px minmax(0, 1fr);
}

.member-affiliation a {
  font-weight: 750;
}

.news-item__image {
  height: 72px;
  overflow: hidden;
  background: var(--paper-soft);
  border-radius: 5px;
}

.news-item__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.news-item__image--logo {
  display: grid;
  place-items: center;
  padding: 7px;
  background: white;
  border: 1px solid var(--line);
}

.news-item__image--logo img {
  object-fit: contain;
}

.news-item__date time,
.news-item__date span {
  display: block;
}

.news-item__date time {
  font-size: 0.75rem;
  font-weight: 750;
}

.news-item__date span {
  margin-top: 2px;
  color: var(--uga-red);
  font-size: 0.68rem;
  text-transform: uppercase;
}

.news-item__body h3 {
  margin-bottom: 4px;
  font-family: var(--serif);
  font-size: 1.08rem;
}

.news-item__body p {
  max-width: 780px;
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.82rem;
}

/* Members */
.members-layout {
  padding: 30px 0 42px;
}

.member-section + .member-section {
  margin-top: 34px;
}

.member-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding-top: 12px;
}

.member-section--pi .member-list {
  grid-template-columns: 1fr;
}

.member-card {
  min-width: 0;
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 14px;
  padding: 10px;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.member-section--pi .member-card {
  grid-template-columns: 132px minmax(0, 1fr);
  padding: 12px 0;
  border: 0;
  border-radius: 0;
}

.member-photo {
  display: block;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  background: var(--paper-soft);
  border-radius: 5px;
}

.member-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(var(--member-photo-zoom, 1));
  transform-origin: 50% 28%;
  transition: transform 220ms ease;
}

.member-card:hover .member-photo img {
  transform: scale(calc(var(--member-photo-zoom, 1) + 0.025));
}

.member-copy {
  min-width: 0;
  align-self: start;
}

.member-section--pi .member-copy {
  align-self: center;
}

.member-copy h3 {
  margin-bottom: 2px;
  font-family: var(--serif);
  font-size: 1.15rem;
}

.member-role,
.member-affiliation,
.member-bio {
  margin-bottom: 5px;
}

.member-role {
  color: var(--uga-red);
  font-size: 0.76rem;
  font-weight: 700;
}

.member-affiliation {
  color: var(--muted);
  font-size: 0.74rem;
}

.member-bio {
  color: var(--ink-soft);
  font-size: 0.79rem;
}

.member-links {
  margin-top: 8px;
  gap: 5px;
}

.member-links a {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  border: 1px solid var(--line-dark);
  border-radius: 50%;
}

.member-links a:hover,
.member-links a:focus-visible {
  color: var(--uga-red);
  border-color: var(--uga-red);
}

.member-links svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7;
}

.member-card--placeholder {
  background: white;
  border-style: solid;
}

.alumni-archive-link {
  margin: 10px 2px 0;
  color: var(--muted);
  font-size: 0.7rem;
}

.alumni-archive-link a {
  border-bottom: 1px solid transparent;
}

.alumni-archive-link a:hover,
.alumni-archive-link a:focus-visible {
  color: var(--ink-soft);
  border-bottom-color: var(--line-dark);
}

/* PI profile */
.profile-header {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 30px;
  align-items: center;
  padding: 30px 0;
  border-bottom: 1px solid var(--line);
}

.profile-header img {
  width: 170px;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius);
}

.profile-header h1 {
  margin-bottom: 5px;
  font-family: var(--serif);
  font-size: 2.2rem;
}

.profile-title {
  margin-bottom: 6px;
  color: var(--uga-red);
  font-weight: 700;
}

.profile-affiliation {
  margin-bottom: 12px;
  color: var(--ink-soft);
}

.profile-content {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(250px, 0.55fr);
  gap: 46px;
  padding: 30px 0 42px;
}

.profile-content h2 {
  margin-bottom: 8px;
  font-family: var(--serif);
  font-size: 1.35rem;
}

.profile-content p,
.profile-content li {
  color: var(--ink-soft);
  font-size: 0.87rem;
}

.profile-content section + section {
  margin-top: 24px;
}

.fact-list {
  padding: 0;
  margin: 0;
  list-style: none;
  border-top: 2px solid var(--ink);
}

.fact-list li {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.fact-list strong,
.fact-list span {
  display: block;
}

.fact-list strong {
  margin-bottom: 2px;
  color: var(--ink);
  font-size: 0.74rem;
}

.fact-lines > span + span {
  margin-top: 5px;
}

/* Research and publications */
.research-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.research-card {
  padding: 17px;
  background: white;
  border: 1px solid var(--line);
  border-top: 3px solid var(--uga-red);
  border-radius: var(--radius);
}

.research-card h3 {
  margin-bottom: 7px;
  font-family: var(--serif);
  font-size: 1.18rem;
}

.research-card p {
  margin-bottom: 10px;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.research-card ul {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.research-card li {
  padding: 3px 7px;
  color: var(--ink-soft);
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 0.67rem;
}

.publication-jump {
  margin-bottom: 22px;
}

.publication-jump a {
  padding: 5px 9px;
  background: white;
  border: 1px solid var(--line-dark);
  border-radius: 4px;
  font-size: 0.73rem;
  font-weight: 700;
}

.publication-group + .publication-group {
  margin-top: 32px;
}

.publication-list {
  padding: 0;
  margin: 0;
  list-style: none;
}

.publication-item {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.publication-item time {
  color: var(--ink);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-weight: 700;
}

.publication-item time span {
  display: block;
  color: var(--uga-red);
  font-family: var(--sans);
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.publication-copy h4 {
  margin-bottom: 4px;
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 700;
}

.publication-authors,
.publication-venue {
  margin-bottom: 3px;
  font-size: 0.76rem;
  line-height: 1.45;
}

.publication-authors {
  color: var(--ink-soft);
}

.publication-venue {
  margin-bottom: 0;
  color: var(--uga-red-dark);
  font-style: italic;
}

/* Opportunities */
.opportunity-page {
  padding-bottom: 42px;
}

.opportunity-grid {
  padding: 14px 0 6px;
}

.opportunity-card {
  width: 100%;
  max-width: none;
  padding: 20px 0 24px;
}

.opportunity-card + .opportunity-card {
  border-top: 1px solid var(--line);
}

.opportunity-card h2 {
  margin-bottom: 7px;
  font-family: var(--serif);
  font-size: 1.25rem;
}

.opportunity-card > p {
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.opportunity-card ul {
  padding-left: 18px;
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.opportunity-card li + li {
  margin-top: 4px;
}

.opportunity-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 13px;
  padding-bottom: 2px;
  color: var(--uga-red);
  border-bottom: 1px solid rgba(186, 12, 47, 0.38);
  font-size: 0.78rem;
  font-weight: 750;
}

/* Entrepreneurship */
.entrepreneurship-sponsors {
  padding: 18px 0 4px;
}

.entrepreneurship-sponsors h2 {
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.3rem;
}

.entrepreneurship-sponsors__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 32px;
}

.entrepreneurship-sponsor {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 5px 0;
}

.entrepreneurship-sponsor:hover .entrepreneurship-sponsor__name,
.entrepreneurship-sponsor:focus-visible .entrepreneurship-sponsor__name {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.entrepreneurship-sponsor__logo {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 150px;
  width: 150px;
  height: 54px;
}

.entrepreneurship-sponsor__logo img {
  width: 100%;
  max-width: 150px;
  height: 100%;
  object-fit: contain;
}

.entrepreneurship-sponsor__name {
  display: block;
  font-size: 0.86rem;
  font-weight: 600;
}

.entrepreneurship-sponsor__name > span {
  margin-left: 4px;
  color: var(--uga-red);
}

@media (max-width: 600px) {
  .entrepreneurship-sponsors__grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .entrepreneurship-sponsor {
    gap: 12px;
  }

  .entrepreneurship-sponsor__logo {
    flex-basis: 120px;
    width: 120px;
    height: 46px;
  }
}

.entrepreneurship-overview {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
  gap: 48px;
  padding: 30px 0 34px;
}

.entrepreneurship-overview h2,
.venture-section .section-bar h2 {
  margin-bottom: 9px;
  font-family: var(--serif);
  font-size: 1.3rem;
}

.entrepreneurship-copy p {
  margin-bottom: 10px;
  color: var(--ink-soft);
  font-size: 0.86rem;
}

.entrepreneurship-copy p:last-child {
  margin-bottom: 0;
}

.entrepreneurship-support ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 0;
  margin: 0;
  border-top: 2px solid var(--ink);
  list-style: none;
}

.entrepreneurship-support li {
  min-width: 0;
  padding: 10px 14px 11px 0;
  border-bottom: 1px solid var(--line);
}

.entrepreneurship-support li:nth-child(even) {
  padding-right: 0;
  padding-left: 14px;
}

.entrepreneurship-support strong,
.entrepreneurship-support span {
  display: block;
}

.entrepreneurship-support strong {
  margin-bottom: 2px;
  color: var(--uga-red-dark);
  font-size: 0.78rem;
}

.entrepreneurship-support span {
  color: var(--ink-soft);
  font-size: 0.76rem;
}

.venture-section {
  padding-bottom: 6px;
}

.venture-section .section-bar {
  align-items: end;
}

.venture-section .section-bar h2 {
  margin-bottom: 0;
}

.venture-section .section-bar > span {
  color: var(--muted);
  font-size: 0.72rem;
}

.venture-directory__status {
  padding: 18px 0;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.entrepreneurship-paths {
  padding-top: 18px;
  border-top: 2px solid var(--ink);
}

.entrepreneurship-paths > a {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr) 24px;
  gap: 18px;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.entrepreneurship-paths strong {
  font-size: 0.86rem;
}

.entrepreneurship-paths span {
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.entrepreneurship-paths i {
  color: var(--uga-red);
  font-style: normal;
  text-align: right;
}

.page-heading__actions {
  margin-top: 18px;
}

/* Entrepreneurship support */
.support-route-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  padding: 6px 0 34px;
}

.support-route-grid > a {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
  min-width: 0;
  padding: 20px 22px;
  border-top: 3px solid var(--uga-red);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-left: 1px solid var(--line);
  background: var(--paper);
}

.support-route-grid__label {
  color: var(--uga-red);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.support-route-grid strong {
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.2;
}

.support-route-grid strong + span {
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.support-route-grid i {
  padding-top: 6px;
  color: var(--uga-red-dark);
  font-size: 0.74rem;
  font-style: normal;
  font-weight: 750;
}

.support-path {
  scroll-margin-top: 24px;
  padding: 28px 0 34px;
  border-top: 2px solid var(--ink);
}

.support-path + .support-path {
  margin-top: 12px;
}

.support-path__heading {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  margin-bottom: 22px;
}

.support-path__heading > span {
  min-width: 34px;
  padding-top: 3px;
  color: var(--uga-red);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.support-path__eyebrow {
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.support-path__heading h2 {
  margin-bottom: 0;
  font-family: var(--serif);
  font-size: 1.45rem;
}

.support-path__summary {
  max-width: 900px;
  margin-top: 8px;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.support-path__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  padding-left: 49px;
}

.support-path__body--single {
  grid-template-columns: minmax(0, 1fr);
}

.support-path__copy > p {
  margin-bottom: 12px;
  color: var(--ink-soft);
  font-size: 0.84rem;
}

.support-path__copy a:not(.button) {
  color: var(--uga-red-dark);
  border-bottom: 1px solid rgba(186, 12, 47, 0.32);
}

.support-steps {
  padding: 0;
  margin: 0;
  list-style: none;
}

.support-step {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 15px;
  padding: 20px 0;
  border-top: 1px solid var(--line);
}

.support-step:first-child {
  padding-top: 0;
  border-top: 0;
}

.support-step__number {
  color: var(--uga-red);
  font-size: 0.78rem;
  font-weight: 850;
}

.support-step__content h3 {
  margin-bottom: 7px;
  font-family: var(--serif);
  font-size: 1.08rem;
}

.support-step__content > p {
  max-width: 900px;
  margin-bottom: 12px;
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.support-step__content > p a {
  color: var(--uga-red-dark);
  border-bottom: 1px solid rgba(186, 12, 47, 0.32);
}

.support-step__content > p code {
  padding: 2px 5px;
  color: var(--ink);
  background: var(--paper-soft);
  border-radius: 3px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 0.75rem;
}

.support-step .submission-details {
  margin-block: 14px 16px;
}

.support-step .template-picker {
  margin-top: 16px;
}

.submission-details {
  margin: 18px 0 20px;
  border-top: 1px solid var(--line-dark);
}

.submission-details > div {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr);
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.submission-details dt {
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
}

.submission-details dd {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.submission-details code {
  padding: 2px 5px;
  color: var(--ink);
  background: var(--paper-soft);
  border-radius: 3px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 0.73rem;
}

.template-picker {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 2px solid var(--uga-red);
}

.template-picker article {
  min-width: 0;
  padding: 16px 18px 18px;
  border-bottom: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

.template-picker article:last-child {
  border-right: 1px solid var(--line);
}

.template-picker article > span {
  color: var(--uga-red);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.template-picker h3 {
  margin: 5px 0 7px;
  font-family: var(--serif);
  font-size: 1.08rem;
}

.template-picker p {
  min-height: 68px;
  margin-bottom: 12px;
  color: var(--ink-soft);
  font-size: 0.75rem;
}

.template-picker a {
  color: var(--uga-red);
  font-size: 0.75rem;
  font-weight: 750;
}

.template-picker__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 14px;
}

/* Team directory */
.team-directory {
  padding-top: 22px;
  padding-bottom: 30px;
}

.team-directory .section-bar {
  align-items: end;
}

.team-directory .section-bar h2 {
  margin-bottom: 0;
  font-family: var(--serif);
  font-size: 1.3rem;
}

.team-directory .section-bar > span {
  color: var(--muted);
  font-size: 0.72rem;
}

.team-directory__status {
  padding: 22px 0;
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding-top: 18px;
}

.team-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--uga-red);
}

.team-card__heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 5px 16px;
  align-items: start;
  margin-bottom: 12px;
}

.team-card__heading h2 {
  grid-column: 1 / -1;
  margin-bottom: 2px;
  font-family: var(--serif);
  font-size: 1.2rem;
}

.team-card__heading h2 a {
  color: inherit;
  text-decoration: none;
}

.team-card__heading h2 a:hover,
.team-card__heading h2 a:focus-visible {
  color: var(--uga-red);
  text-decoration: underline;
  text-underline-offset: 0.12em;
}

.team-card__heading p {
  grid-column: 1;
  min-width: 0;
  margin-bottom: 0;
  color: var(--muted);
  font-size: 0.7rem;
}

.team-card__stage {
  position: static;
  grid-row: 2;
  grid-column: 2;
  justify-self: end;
  padding: 3px 7px;
  color: var(--uga-red-dark);
  background: var(--paper-red);
  border-radius: 99px;
  font-size: 0.63rem;
  font-weight: 750;
}

.team-card__bio {
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.team-card dl {
  margin: 4px 0 0;
}

.team-card dl > div {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr);
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}

.team-card dt {
  color: var(--ink);
  font-size: 0.67rem;
  font-weight: 800;
  text-transform: uppercase;
}

.team-card dd {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.73rem;
}

.team-card .opportunity-action {
  align-self: flex-start;
  margin-top: auto;
  padding-top: 15px;
}

.team-submit-note {
  padding: 18px 0 4px;
  border-top: 1px solid var(--line-dark);
  color: var(--ink-soft);
  font-size: 0.79rem;
}

.team-submit-note a {
  color: var(--uga-red);
  font-weight: 750;
}


/* Alavon */
.alavon-hero {
  position: relative;
  overflow: hidden;
  padding: 38px 0 40px;
  color: white;
  background:
    radial-gradient(circle at 88% 15%, rgba(21, 211, 195, 0.2), transparent 28%),
    radial-gradient(circle at 72% 100%, rgba(0, 116, 184, 0.22), transparent 34%),
    #061a38;
}

.alavon-hero::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 4px;
  background: linear-gradient(90deg, #086bb4, #18d5c3);
  content: "";
}

.alavon-hero__content {
  position: relative;
  z-index: 1;
}

.alavon-kicker,
.alavon-eyebrow {
  margin-bottom: 8px;
  color: #0878a7;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.alavon-kicker {
  color: #4de1d4;
}

.alavon-hero__logo {
  width: min(360px, 72vw);
  margin-bottom: 20px;
}

.alavon-hero__copy p {
  margin-bottom: 9px;
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.9rem;
}

.alavon-hero__copy strong {
  color: white;
}

.alavon-hero__copy a {
  color: white;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
}

.alavon-hero__copy a:hover,
.alavon-hero__copy a:focus-visible {
  color: #69e9de;
  border-bottom-color: #69e9de;
}

.alavon-hero .button-row {
  margin-top: 19px;
}

.alavon-button {
  color: #061a38;
  background: #21d7c6;
  border-color: #21d7c6;
}

.alavon-button:hover,
.alavon-button:focus-visible {
  color: #061a38;
  background: #69e9de;
  border-color: #69e9de;
}

.alavon-button--outline {
  color: white;
  background: transparent;
  border-color: rgba(255, 255, 255, 0.55);
}

.alavon-button--outline:hover,
.alavon-button--outline:focus-visible {
  color: white;
  background: rgba(255, 255, 255, 0.09);
  border-color: white;
}

.alavon-section-intro {
  margin-bottom: 24px;
}

.alavon-section-intro h2,
.alavon-capabilities h2 {
  margin-bottom: 9px;
  font-family: var(--serif);
  font-size: 1.45rem;
  letter-spacing: -0.02em;
}

.alavon-section-intro > p:last-child {
  color: var(--ink-soft);
  font-size: 0.86rem;
}

.alavon-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.alavon-steps li {
  padding-top: 12px;
  border-top: 2px solid #0784a7;
}

.alavon-steps span {
  display: block;
  margin-bottom: 5px;
  color: #0784a7;
  font-size: 0.68rem;
  font-weight: 800;
}

.alavon-steps h3 {
  margin-bottom: 4px;
  font-family: var(--serif);
  font-size: 1.08rem;
}

.alavon-steps p {
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.79rem;
}

.alavon-capabilities {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  gap: 46px;
  align-items: center;
}

.alavon-mark {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  background: #eef8f8;
  border-radius: 50%;
}

.alavon-mark img {
  width: 68%;
}

.alavon-capability-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 24px;
  padding: 0;
  margin: 18px 0 0;
  border-top: 2px solid var(--ink);
  list-style: none;
}

.alavon-capability-list li {
  padding: 10px 0 11px;
  border-bottom: 1px solid var(--line);
}

.alavon-capability-list strong,
.alavon-capability-list span {
  display: block;
}

.alavon-capability-list strong {
  margin-bottom: 2px;
  color: #0878a7;
  font-size: 0.78rem;
}

.alavon-capability-list span {
  color: var(--ink-soft);
  font-size: 0.76rem;
}

/* RoStudio */
.rostudio-page {
  --ro-purple: #7c3aed;
  --ro-purple-light: #a78bfa;
  --ro-line: #ddd6e8;
  color: var(--ink);
  background: white;
}

.rostudio-hero {
  position: relative;
  overflow: hidden;
  padding: 54px 0 50px;
  text-align: center;
  background: white;
  border-bottom: 1px solid var(--line);
}

.rostudio-hero__content {
  position: relative;
  z-index: 1;
}

.rostudio-kicker {
  margin-bottom: 10px;
  color: #6d28d9;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.rostudio-hero__logo {
  width: min(390px, 76vw);
  margin: 0 auto 34px;
}

.rostudio-hero__copy {
  width: 100%;
}

.rostudio-hero__copy p,
.rostudio-section p:not(.rostudio-kicker) {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.rostudio-hero__copy p {
  margin-bottom: 10px;
}

.rostudio-hero__copy a {
  color: #6d28d9;
  border-bottom: 1px solid rgba(109, 40, 217, 0.4);
}

.rostudio-hero__copy a:hover,
.rostudio-hero__copy a:focus-visible {
  color: var(--uga-red);
  border-bottom-color: var(--uga-red);
}

.rostudio-hero .button-row {
  justify-content: center;
  margin-top: 24px;
}

.rostudio-button {
  color: white;
  background: linear-gradient(#9333ea, #7e22ce);
  border-color: rgba(167, 139, 250, 0.35);
  border-radius: 7px;
}

.rostudio-button:hover,
.rostudio-button:focus-visible {
  color: white;
  background: linear-gradient(#a044f0, #8b2bd7);
  border-color: rgba(196, 181, 253, 0.6);
}

.rostudio-button--outline {
  color: #6d28d9;
  background: transparent;
  border-color: rgba(109, 40, 217, 0.35);
}

.rostudio-button--outline:hover,
.rostudio-button--outline:focus-visible {
  color: white;
  background: #6d28d9;
  border-color: #6d28d9;
}

.rostudio-statband {
  padding: 28px 0;
  background: var(--paper-soft);
  border-bottom: 1px solid var(--line);
}

.rostudio-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(140px, 180px));
  justify-content: center;
  gap: 64px;
  padding: 0;
  margin-block: 0;
  margin-inline: auto;
  list-style: none;
  text-align: center;
}

.rostudio-stats strong,
.rostudio-stats span {
  display: block;
}

.rostudio-stats strong {
  color: var(--ink);
  font-family: var(--serif);
  font-size: 2rem;
  line-height: 1;
}

.rostudio-stats span {
  margin-top: 7px;
  color: #6d28d9;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.rostudio-section {
  padding: 48px 0;
  border-top: 1px solid var(--line);
}

.rostudio-section h2 {
  margin-bottom: 12px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.55rem;
  letter-spacing: -0.02em;
}

.rostudio-gist {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 52px;
  align-items: center;
}

.rostudio-gist p:last-child {
  margin-bottom: 0;
}

.rostudio-system-map {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 18px;
  background: #f7f5fa;
  border: 1px solid var(--ro-line);
  border-radius: 12px;
}

.rostudio-system-map strong,
.rostudio-system-map span {
  display: grid;
  min-height: 58px;
  place-items: center;
  padding: 8px;
  text-align: center;
}

.rostudio-system-map strong {
  grid-column: 1 / -1;
  color: var(--ink);
  background: #eee8fa;
  border: 1px solid #d7caef;
  border-radius: 7px;
  font-size: 0.78rem;
}

.rostudio-system-map span {
  color: #5b21b6;
  background: white;
  border: 1px solid #e5e0ea;
  border-radius: 6px;
  font-size: 0.72rem;
}

.rostudio-agents-section,
.rostudio-recruit {
  text-align: center;
}

.rostudio-agents-section {
  background: var(--paper-soft);
}

.rostudio-agents-section > .shell > p:not(.rostudio-kicker),
.rostudio-recruit > .shell > p:not(.rostudio-kicker) {
  max-width: 760px;
  margin-inline: auto;
}

.rostudio-agents {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.rostudio-agent {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 17px;
  text-align: left;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.rostudio-agent h3 {
  margin-bottom: 5px;
  color: var(--ink);
  font-size: 0.9rem;
}

.rostudio-agent p {
  margin-bottom: 13px;
  font-size: 0.76rem;
}

.rostudio-status {
  align-self: flex-start;
  margin-top: auto;
  padding: 3px 8px;
  color: #c084fc;
  border: 1px solid rgba(192, 132, 252, 0.35);
  border-radius: 999px;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.rostudio-status--soon {
  color: var(--muted);
  border-color: var(--line-dark);
}

.rostudio-roles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  margin: 20px 0 0;
  list-style: none;
}

.rostudio-roles li {
  padding: 5px 10px;
  color: var(--ink-soft);
  background: white;
  border: 1px solid var(--line-dark);
  border-radius: 5px;
  font-size: 0.68rem;
}

/* EZCollegeApp */
.ez-intro {
  padding: 30px 0;
  color: white;
  background: var(--black);
  border-bottom: 4px solid var(--uga-red);
}

.ez-intro__grid {
  display: grid;
  grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.25fr);
  gap: 42px;
  align-items: center;
}

.ez-wordmark {
  width: min(380px, 100%);
}

.ez-wordmark img {
  width: 100%;
  height: auto;
}

.ez-intro p {
  margin-bottom: 13px;
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.94rem;
}

.ez-intro .button--outline {
  color: white;
  background: transparent;
  border-color: rgba(255, 255, 255, 0.45);
}

.ez-intro .button--outline:hover,
.ez-intro .button--outline:focus-visible {
  color: white;
  background: rgba(255, 255, 255, 0.08);
  border-color: white;
}

.product-layout {
  display: grid;
  grid-template-columns: minmax(240px, 0.7fr) minmax(0, 1.3fr);
  gap: 42px;
}

.product-layout h2,
.lab-connection h2 {
  margin-bottom: 8px;
  font-family: var(--serif);
  font-size: 1.4rem;
}

.product-layout > div > p,
.lab-connection p {
  color: var(--ink-soft);
  font-size: 0.86rem;
}

.feature-list {
  padding: 0;
  margin: 0;
  list-style: none;
  border-top: 2px solid var(--ink);
}

.feature-list li {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.79rem;
}

.feature-list strong {
  color: var(--uga-red-dark);
}

.feature-list span {
  color: var(--ink-soft);
}

.lab-connection {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
  gap: 42px;
  align-items: start;
}

.program-links {
  border-top: 2px solid var(--ink);
}

.program-links a {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.82rem;
  font-weight: 700;
}

/* Footer */
.site-footer {
  color: white;
  background: var(--black);
  border-top: 4px solid var(--uga-red);
}

.footer-row {
  min-height: 92px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  padding-block: 18px;
}

.footer-identity {
  display: flex;
  align-items: center;
  gap: 11px;
}

.footer-identity img {
  width: 38px;
  height: 38px;
  border-radius: 7px;
}

.footer-identity strong,
.footer-identity span,
.footer-links > span {
  display: block;
}

.footer-identity strong {
  font-family: var(--serif);
  font-size: 1rem;
}

.footer-identity span,
.footer-links {
  color: rgba(255, 255, 255, 0.62);
  font-size: 0.7rem;
}

.footer-links {
  text-align: right;
}

.footer-links > * {
  white-space: nowrap;
}

.footer-links a {
  color: white;
}

.footer-identity span a {
  color: white;
}

.footer-contact-links {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  margin-bottom: 4px;
}

.footer-contact-links .social-link {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.footer-contact-links .social-link:hover,
.footer-contact-links .social-link:focus-visible {
  color: white;
  border-color: white;
}

.footer-contact-links .social-link svg {
  width: 14px;
  height: 14px;
}

/* AI News */
.ai-news-page {
  padding-bottom: 52px;
}

.ai-news-loading,
.ai-news-not-found {
  padding: 48px 0;
  color: var(--ink-soft);
}

.ai-news-heading > p a {
  border-bottom: 1px solid var(--line);
}

.ai-news-attention__heading > p {
  margin-bottom: 7px;
  color: var(--uga-red);
  font-size: 0.7rem;
  font-weight: 850;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.ai-news-meta {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.025em;
}

.ai-news-read {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 13px;
  padding-bottom: 2px;
  color: var(--uga-red);
  border-bottom: 1px solid rgba(186, 12, 47, 0.38);
  font-size: 0.78rem;
  font-weight: 750;
}

.ai-news-search {
  padding: 17px 0;
  border-bottom: 1px solid var(--line);
}

.ai-news-search > summary {
  width: fit-content;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  list-style: none;
}

.ai-news-search > summary::-webkit-details-marker {
  display: none;
}

.ai-news-search > summary::after {
  content: "+";
  color: var(--uga-red);
  font-size: 1rem;
  font-weight: 500;
  line-height: 1;
}

.ai-news-search[open] > summary::after {
  content: "−";
}

.ai-news-search > summary:hover,
.ai-news-search > summary:focus-visible {
  color: var(--uga-red);
}

.ai-news-search__form {
  padding-top: 11px;
}

.ai-news-search__control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
}

.ai-news-search input {
  width: 100%;
  min-height: 40px;
  padding: 8px 11px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line-dark);
  border-radius: 4px;
  outline: none;
}

.ai-news-search input:focus {
  border-color: var(--uga-red);
  box-shadow: 0 0 0 2px rgba(186, 12, 47, 0.1);
}

.ai-news-search__control > span {
  color: var(--muted);
  font-size: 0.72rem;
  white-space: nowrap;
}

.newsletter {
  margin-top: 40px;
  margin-bottom: 48px;
  padding: clamp(20px, 4vw, 36px);
  border: 1px solid var(--line);
  border-top: 3px solid var(--uga-red);
  background: var(--paper-soft);
}

.newsletter__eyebrow {
  margin: 0 0 8px;
  color: var(--uga-red);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.newsletter h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.4rem, 3vw, 2rem);
}

.newsletter > p:not(.newsletter__eyebrow) {
  max-width: 65ch;
}

.newsletter__status {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.newsletter__form {
  display: block;
  width: 100%;
  max-width: 680px;
  height: 720px;
  margin: 20px 0 12px;
  border: 0;
  background: var(--paper);
}

.ai-news-weekly {
  margin-top: 24px;
  overflow: hidden;
  color: #ffffff;
  background: #111111;
  border-top: 3px solid var(--uga-red);
}

.ai-news-weekly__heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 15px 20px 13px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.18);
}

.ai-news-weekly__heading p,
.ai-news-weekly__kicker {
  margin-bottom: 4px;
  color: #ef5269;
  font-size: 0.68rem;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ai-news-weekly__heading h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.25rem;
}

.ai-news-weekly__heading > span {
  color: #c8c8c8;
  font-size: 0.75rem;
  white-space: nowrap;
}

.ai-news-weekly__feature {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(330px, 0.92fr);
}

.ai-news-weekly__visual {
  min-height: 300px;
  display: block;
  overflow: hidden;
  background: #202020;
}

.ai-news-weekly__visual img {
  width: 100%;
  height: 100%;
  min-height: 300px;
  object-fit: cover;
}

.ai-news-weekly__body {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px 26px;
}

.ai-news-weekly__body h2 {
  margin: 6px 0 12px;
  font-family: var(--serif);
  font-size: clamp(1.45rem, 2.2vw, 1.9rem);
  line-height: 1.1;
  letter-spacing: -0.025em;
}

.ai-news-weekly__body h2 a,
.ai-news-weekly__actions a,
.ai-news-weekly__previous a {
  color: inherit;
}

.ai-news-weekly__body > p:not(.ai-news-weekly__kicker) {
  margin-bottom: 16px;
  color: #d3d3d3;
  font-size: 0.82rem;
  line-height: 1.6;
}

.ai-news-weekly__metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 0 0 18px;
  padding: 12px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.18);
  border-bottom: 1px solid rgba(255, 255, 255, 0.18);
}

.ai-news-weekly__metrics div {
  min-width: 0;
  padding-right: 12px;
}

.ai-news-weekly__metrics div + div {
  padding-left: 12px;
  border-left: 1px solid rgba(255, 255, 255, 0.18);
}

.ai-news-weekly__metrics dt {
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 750;
}

.ai-news-weekly__metrics dd {
  margin: 2px 0 0;
  color: #bdbdbd;
  font-size: 0.62rem;
  line-height: 1.35;
  text-transform: uppercase;
}

.ai-news-weekly__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.ai-news-weekly__actions .button {
  color: #ffffff;
  background: var(--uga-red);
  border-color: var(--uga-red);
}

.ai-news-weekly__actions > a:not(.button),
.ai-news-weekly__previous a {
  font-size: 0.74rem;
  font-weight: 750;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
}

.ai-news-weekly__previous {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 24px;
  padding: 12px 20px 14px;
  color: #cccccc;
  border-top: 1px solid rgba(255, 255, 255, 0.18);
}

.ai-news-weekly__previous strong {
  color: #ffffff;
  font-size: 0.72rem;
}

.ai-news-index-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 32px;
  align-items: start;
  padding-top: 34px;
}

.ai-news-attention {
  align-self: start;
  padding: 20px;
  background: var(--paper-soft);
  border-top: 3px solid var(--ink);
}

.ai-news-attention__heading {
  margin-bottom: 18px;
}

.ai-news-attention__heading h2 {
  margin-bottom: 4px;
  font-family: var(--serif);
  font-size: 1.35rem;
}

.ai-news-attention__heading > span,
.ai-news-attention__comparison {
  color: var(--muted);
  font-size: 0.7rem;
}

.ai-news-attention__list {
  padding: 0;
  margin: 0;
  list-style: none;
}

.ai-news-attention__list li + li {
  margin-top: 12px;
}

.ai-news-attention__label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
  font-size: 0.74rem;
}

.ai-news-attention__label strong {
  flex: 0 0 auto;
  font-size: 0.72rem;
}

.ai-news-attention__label .is-up {
  color: var(--uga-red);
}

.ai-news-attention__label .is-down {
  color: var(--muted);
}

.ai-news-attention__track {
  position: relative;
  height: 5px;

  background: #dddddc;
}

.ai-news-attention__track span {
  display: block;
  height: 100%;
  background: var(--uga-red);
}

.ai-news-attention__track i {
  position: absolute;
  top: -2px;
  bottom: -2px;
  left: 62.5%;
  width: 1px;
  background: var(--ink);
}

.ai-news-attention__list small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.63rem;
}

.ai-news-attention__note {
  margin: 19px 0 3px;
  color: var(--ink-soft);
  font-size: 0.68rem;
}

.ai-news-attention__comparison {
  margin-bottom: 0;
}

.ai-news-archive {
  padding-top: 4px;
}

.ai-news-pagination {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
  padding-top: 24px;
}

.ai-news-pagination p {
  margin: 0;
  color: var(--muted);
  font-size: 0.75rem;
}

.ai-news-pagination .button {
  cursor: pointer;
}

.ai-news-pagination .button:disabled {
  cursor: wait;
  opacity: 0.65;
}

.ai-news-pagination [role="alert"] {
  flex-basis: 100%;
  color: var(--uga-red);
}

.ai-news-empty {
  padding: 28px 0;
  color: var(--ink-soft);
}

.ai-news-archive .section-bar > span {
  color: var(--muted);
  font-size: 0.72rem;
}

.ai-news-month {
  padding-top: 24px;
}

.ai-news-month + .ai-news-month {
  margin-top: 14px;
  border-top: 1px solid var(--line);
}

.ai-news-month > h2 {
  margin-bottom: 6px;
  color: var(--ink-soft);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ai-news-list {
  display: grid;
  gap: 0;
}

.ai-news-card {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 20px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}

.ai-news-card__image {
  min-height: 120px;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  background: var(--paper-soft);
}

.ai-news-card__image img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.ai-news-card--text {
  grid-template-columns: minmax(0, 1fr);
}

.ai-news-card__body {
  min-width: 0;
}

.ai-news-card h3 {
  margin: 6px 0 6px;
  font-family: var(--serif);
  font-size: 1.22rem;
  letter-spacing: -0.015em;
}

.ai-news-card__body > p {
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.ai-news-article {
  padding-top: 30px;
}

.ai-news-article__header {
  margin-bottom: 30px;
}

.ai-news-article__header h1 {
  margin: 9px 0 11px;
  font-family: var(--serif);
  font-size: clamp(1.85rem, 3.4vw, 2.7rem);
  letter-spacing: -0.035em;
}

.ai-news-article__dek {
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 1rem;
}

.ai-news-article__hero {

  padding: 18px;
  background: var(--paper-soft);
  border-top: 3px solid var(--uga-red);

.ai-news-article__hero img {

  max-width: 100%;
  max-height: 360px;
  margin-inline: auto;
  object-fit: contain;

.ai-news-article figure figcaption {
  margin-top: 9px;
  color: var(--muted);
  font-size: 0.68rem;
}

.ai-news-article__layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 54px;
  align-items: start;
}

.ai-news-article__copy {
  min-width: 0;
}

.ai-news-article__copy > p {
  margin-bottom: 17px;
  color: #303030;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.75;
}

.ai-news-article__copy > h2 {
  margin: 33px 0 11px;
  font-family: var(--serif);
  font-size: 1.55rem;
  letter-spacing: -0.02em;
}

.ai-news-article__copy > figure {
  margin: 28px 0;
  padding: 16px;
  background: var(--paper-soft);
}

.ai-news-article__copy > figure img {
  width: 100%;
  max-height: 720px;
  object-fit: contain;
}

.ai-news-figure-link {
  display: grid;
  place-items: center;
}

.ai-news-sources {
  padding: 17px 0 0;
  border-top: 2px solid var(--ink);
}

.ai-news-sources h2 {
  margin-bottom: 10px;
  font-family: var(--serif);
  font-size: 1.1rem;
}

.ai-news-sources ol {
  padding-left: 18px;
  margin: 0;
}

.ai-news-sources li {
  padding-left: 3px;
  color: var(--ink-soft);
  font-size: 0.72rem;
}

.ai-news-sources li + li {
  margin-top: 9px;
}

er 25 company technical report. Decoding design, training cost and optional two-pass prefill are distinct compute budgets; no independent reproduction established."}, "kaml": {"id": "kaml", "name": "Shen et al.: KaML-ESM accepted journal paper", "url": "https://www.nature.com/articles/s41467-026-78406-y", "measurement": "October 24 Nature Communications publication, DOI 10.1038/s41467-026-78406-y. Earlier preprint exists. Native-protein and engineered-mutation evaluation sets have different difficulty."}, "hai-rd": {"id": "hai-rd", "name": "Stanford HAI: 2026 AI Index, R&D chapter", "url": "https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_1_research_development.pdf", "measurement": "Annual historical context, including Epoch notable-model access forms in 2025 and longer model-development series. Not an October 2026 census; notable models are not all research."}, "hai-econ": {"id": "hai-econ", "name": "Stanford HAI: 2026 AI Index, Economy chapter", "url": "https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_4_economy.pdf", "measurement": "Historical investment, survey and labour context, largely through 2025. Reuses McKinsey, LinkedIn and Lightcast data; those appearances are not independent replications."}, "mckinsey": {"id": "mckinsey", "name": "McKinsey: State of AI 2026", "url": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai", "measurement": "August 25 publication; online survey May 4–June 8, 2026, 1,719 respondents in 97 nations, GDP-weighted. Reported organisational use and attributed EBIT, not audited causal returns."}, "meta": {"id": "meta", "name": "Meta: Q3 2026 results", "url": "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Third-Quarter-2026-Results/default.aspx", "measurement": "October 21 corporate financial disclosure. Quarterly capital expenditures include finance-lease principal; annual guidance remains a forecast."}, "meta-call": {"id": "meta-call" ections, not observed 2026 hiring or a causal estimate of AI displacement."}}, "tabs": [{"id": "research", "label": "Research / Academia", "claims": [{"claim": "Agent and embodied topics gain recommendation share; this is an attention shift", "confidence": "High for sampled counts; limited external scope", "scope": "Comparable platform recommendations, not publication output or scientific quality.", "horizons": [{"label": "This week · Oct 19–25", "text": "Agent/tool-use titles rise from 94 of 355 recommendations to 101 of 312: 26.5% to 32.4%, index 122. Embodied/robotics titles rise from 34 to 41, index 137. Vision/multimodal titles fall from 106 to 80, index 86. Topics overlap, so shares cannot be added as exclusive categories."}, {"label": "Short term · 1–3 months", "text": "Repeat the unchanged collection and classifier before describing persistence. Biology/medicine remains Watching because two papers in each week fail the five-per-week threshold; it is not a measured decline or an absence of research."}, {"label": "Medium term · 6–12 months", "text": "A sequence of comparable recommendations could distinguish a sustained shift from release-week attention. Changes in the platform, editorial selection or classifier would require a break in the series, not a silent splice."}, {"label": "Longer evidence and open questions", "text": "HAI’s annual publication and notable-model series measure different populations over years. They supply context about the broader research system, but cannot turn these two recommendation windows into an annual field-wide growth rate."}], "interpretation": "More of this sample concerns agents and embodied work while its total recommended-paper count is lower. The index compares topic shares; it does not rank topics by importance or establish that research spending moved.", "counterevidence": "Recommendations are selected and can change retrospectively. Title matching misses synonyms and multi-topic work. Current arXiv metadata inventory ent for a broader cost or scientific claim. Training, inference and out-of-distribution error answer different questions.", "counterevidence": "Recycler is a company technical report without an independent reproduction established here. KaML’s training augmentation is not thousands of newly measured laboratory outcomes; native and engineered test errors differ. These are distinct studies, not mutual replications.", "what_would_change": "Matched-cost independent runs and prospective experimental validation would strengthen the conclusions; failures on intended workloads would narrow them.", "evidence": ["recycler", "kaml", "hai-rd"]}, {"claim": "Research-assistance evidence supports a narrower claim than autonomous discovery", "confidence": "Moderate within the study; low for long-run impact", "scope": "Ai2/Penn LitPivot: a small human-computer interaction study, not a new October scientific breakthrough.", "horizons": [{"label": "This week · Oct 19–25", "text": "Ai2’s October 23 account highlights LitPivot, whose preprint first appeared in April and reviewed v3 in September. Seventeen HCI/NLP researchers compared literature-grounded ideation with a baseline using the same paper corpus and AI chat. The controlled tasks lasted thirty minutes each; two domain experts assessed groundedness."}, {"label": "Short term · 1–3 months", "text": "Testing should distinguish literature grounding, participants’ perceived novelty and actual feasibility. The follow-up involved five participants on their own projects; it is useful exploratory evidence, not a new independent cohort of seventeen successful research projects."}, {"label": "Medium term · 6–12 months", "text": "A stronger result would track experiments completed, rejected ideas, erroneous citations and eventual research outputs across disciplines. Better short-task ratings do not show that a system can execute or validate a research programme."}, {"label": "Longer evidence and open questions", "text": "Across successive generations of research tools, public artifacts, access and expert evaluation determine which claims outsiders can inspect. The annual HAI access series concerns notable models, whereas LitPivot concerns a specific scholarly workflow; their populations should remain separate."}], "interpretation": "The study makes literature consultation and idea revision observable. It supports evaluating an assistant’s contribution to researchers’ work without assigning it responsibility for independently established discoveries.", "counterevidence": "Small specialist sample, controlled seed ideas, corpus coverage and self-reported outcomes limit generalisation. Independent groundedness assessment does not independently certify novelty, practical feasibility or long-term scientific value.", "what_would_change": "Preregistered multi-site studies with longitudinal, externally assessed research outcomes would justify a broader claim.", "evidence": ["ai2", "litpivot", "hai-rd"]}]}, {"id": "industry", "label": "Industry", "claims": [{"claim": "Access expands through previews and APIs before reproducibility expands", "confidence": "High for release status; moderate for implications", "scope": "Claude Duet, Google Cloud distribution and Kimi K3.1 Pro are three different access milestones.", "horizons": [{"label": "This week · Oct 19–25", "text": "Duet opens a US Pro/Max research-preview waitlist; Google Cloud starts an OpenAI private enterprise preview; Kimi makes K3.1 Pro available in products and the API while planning weights by November 4. These are not three completed unrestricted model releases."}, {"label": "Short term · 1–3 months", "text": "Check which customers actually gain access, which announced security features become available and whether Kimi’s weight release occurs on the promised schedule with usable licence and deployment artifacts."}, {"label": "Medium term · 6–12 months", "text": "Procurement convenience may broaden evaluation. Demonstrating durable adoption requires on are separate stages."}, {"label": "Medium term · 6–12 months", "text": "Repeated adversarial tests and scoped external reviews should show whether intended coverage remains effective as tools and internal agents change. Historical pilot percentages cannot be carried forward as today’s coverage."}, {"label": "Longer evidence and open questions", "text": "As agent deployments persist across applications and organisational systems, accountability depends on logs, permission boundaries and who can alter the controls. No single release supplies a multi-year controlled record of safety improvement."}], "interpretation": "The new disclosures improve what can be examined, but an announced fix and an independently verified operational result have different evidentiary weight.", "counterevidence": "METR had unusually deep access but published only part of its private report and faced time/access limits. Its findings concern a historical internal configuration, not consumer accounts or a verified current customer breach.", "what_would_change": "A post-change independent assessment with explicit coverage and failure rates would strengthen confidence; a reproduced bypass would weaken it.", "evidence": ["duet-safety", "containment", "metr"]}, {"claim": "Distribution and capital spending are ahead of demonstrated broad financial returns", "confidence": "Moderate; distinct company and survey populations", "scope": "Cloud procurement, Meta’s company figures and earlier enterprise survey evidence.", "horizons": [{"label": "This week · Oct 19–25", "text": "Google Cloud adds a purchasing route, while Meta’s October 21 account reports more than ten million US/Canada Muse setup users and roughly a quarter of setup users returning daily. Setup users are not daily users. Meta reports $34.91 billion in quarterly capital expenditures including finance-lease principal; annual spending guidance remains prospective."}, {"label": "Short term · 1–3 months", "text": "Track repeat use, realised ntain 1,888 listed advertisements on October 18 and 1,945 on October 25: a net increase of 57, or 3.0%. Anthropic rises from 657 to 681; the eleven other employers together rise from 1,231 to 1,264. Both observations fall within their respective completed New York weeks."}, {"label": "Short term · 1–3 months", "text": "Continue the same board panel, stable posting-ID deduplication and timestamped exports. New first-seen observations are not necessarily new employer postings, and a missing listing is not a confirmed filled or abolished role."}, {"label": "Medium term · 6–12 months", "text": "Two complete observations support one stock comparison, not a three-month hiring trend. Tracking salary disclosure, seniority and role function requires stable definitions and coverage before comparing subgroups."}, {"label": "Longer evidence and open questions", "text": "September US payrolls rose by 29,000 and unemployment was 4.2%, according to the October 2 BLS release. Those broad surveys measure different populations from these advertisements and cannot validate an AI-employer panel as representative. Long-run occupational projections are a third, forward-looking measure."}], "interpretation": "The panel shows more advertised opportunities in this bounded sample. It supplies no estimate of hires, total AI-specialist demand, skill shortages or displacement.", "counterevidence": "The convenience panel is dominated by AI companies, covers all their functions and lacks a matched diversified-large-company or university panel. Regional advertisements may relate to the same underlying recruitment need. Timing differs by a few Sunday hours.", "what_would_change": "A broader stable panel plus actual hires, pay and filled-role data could support stronger labour-market conclusions.", "evidence": ["panel", "bls-now", "bls-long"]}, {"claim": "Workplace readiness is a measurable management problem, not a job-loss total", "confidence": "Moderate for associations; low for causality", "scope": "Two newly released surveys retain their August observation periods and selected populations.", "horizons": [{"label": "This week · Oct 19–25", "text": "Charter’s October 21 report surveys 5,002 full-time US desk-based AI users in August, explicitly excluding never-users. Its cross-sectional results link feeling involved in AI-related work design with reported benefits. Google/Hypothesis’s October 20 report finds a gap between using or planning agents and having clear rules for independent action."}, {"label": "Short term · 1–3 months", "text": "Evaluate training and participation through observed workflow quality, time use and worker experience. Charter’s 45.9-percentage-point association is not an experimental training effect; Google’s 97% combines current use with plans, rather than measuring 97% adoption."}, {"label": "Medium term · 6–12 months", "text": "Repeated or controlled studies should test whether management changes precede improved outcomes. Neither report measures actual changes in the number of jobs created, accepted offers or completed layoffs."}, {"label": "Longer evidence and open questions", "text": "Education-to-work pathways require evidence on access, course completion, subsequent role entry and retention. The annual HAI labour chapter helps locate these questions, but its earlier surveys are not independent confirmation of these August 2026 responses."}], "interpretation": "The reports identify practical hypotheses about involvement, permissions and support. They do not justify predicting how many workers an agent will replace.", "counterevidence": "Charter covers AI users only; its September qualitative interviews are a separate sample. Google’s commissioned survey covers AI-familiar workers and decision-makers at organisations with at least 300 employees in six countries. Neither represents every worker or establishes a causal effect.", "what_would_change": "Longitudinal outcomes including never-users, smaller firms and independently evaluated interventions would strengthen the conclusions.", "evidence": ["charter", "google-work", "hai-econ"]}, {"claim": "China’s policy makes worker transitions explicit; outcomes still need observation", "confidence": "High for policy text; uncertain for implementation", "scope": "An October 23 policy release, not a realised employment-impact estimate.", "horizons": [{"label": "This week · Oct 19–25", "text": "China’s published plan sets eighteen tasks across six areas, including training, employment services, labour rights and risk monitoring. Its document date is October 16. The text encourages transition support and employment-risk assessment in specified settings; it does not report new placements or completed programmes."}, {"label": "Short term · 1–3 months", "text": "Look for implementation dates, responsible agencies, eligibility, funded training places and employer participation. Count enrolment separately from completion, and completion separately from subsequent employment."}, {"label": "Medium term · 6–12 months", "text": "Assess whether affected workers move into sustained roles with comparable income and protections. A job advertisement or a new occupational standard is not proof of an additional job or a successful transition."}, {"label": "Longer evidence and open questions", "text": "BLS’s 2025–35 projections illustrate the different question of how occupational employment might change under stated assumptions. They concern the US and cannot serve as a forecast for China. Current aggregate data also cannot isolate an AI effect without a credible comparison and alternatives such as business-cycle or sector shifts."}], "interpretation": "The policy broadens the agenda from model capability to the institutions around work. Implementation evidence will determine whether that agenda produces measurable support.", "counterevidence": "Goals do not guarantee delivery or establish a net job effect. The matched company panel can rise while particular roles or regions weaken; broad US employment data cannot settle distributional effects in another country.", "what_would_change": "Published programme budgets, completion and placement cohorts, worker follow-up and credible counterfactual evaluation would change this assessment.", "evidence": ["china", "panel", "bls-now", "bls-long"]}]}]};</script><script>(() => {

  const mount = document.querySelector("[data-weekly-analysis]");
  if (!mount) return;

  const catalog = window.AI_NEWS_CATALOG || {};
  const analyses = catalog.weeklyAnalyses || [];

  const escapeHtml = (value = "") => String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  const periodLabel = (dates = []) => {
    if (dates.length !== 2) return "";
    const start = new Date(`${dates[0]}T12:00:00`);
    const end = new Date(`${dates[1]}T12:00:00`);
    const month = new Intl.DateTimeFormat("en-US", { month: "long" }).format(start);
    const endMonth = new Intl.DateTimeFormat("en-US", { month: "long" }).format(end);
    if (start.getFullYear() !== end.getFullYear()) {
      return `${month} ${start.getDate()}, ${start.getFullYear()}–${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }
    return month === endMonth
      ? `${month} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`
      : `${month} ${start.getDate()}–${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
  };

  const sourceMap = (analysis) => {
    const sources = Array.isArray(analysis.sources)
      ? analysis.sources
      : Object.entries(analysis.sources || {}).map(([id, source]) => ({
        ...source,

        name: source.name || source.label

    return new Map(sources.map((source) => [source.id, source]));
  };

  const renderSources = (ids, sources) => {
    const items = (ids || []).map((id) => sources.get(id)).filter(Boolean);
    if (!items.length) return "";
    return `
      <details class="weekly-claim__details">
        <summary>Sources</summary>
        <ul>
          ${items.map((source) => `
            <li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.name)} <span aria-hidden="true">↗</span></a>${source.measurement ? `<p>${escapeHtml(source.measurement)}</p>` : ""}</li>`).join("")}
        </ul>
      </details>`;
  };

  const renderClaim = (claim, sources) => {
    const horizons = Array.isArray(claim.horizons)
      ? claim.horizons
      : [
        { label: "This week", text: claim.this_week },
        { label: "Short term", text: claim.near_term },

    return `

          <section>
            <h3>${escapeHtml(horizon.label)}</h3>
            <p>${escapeHtml(horizon.text)}</p>
          </section>`).join("")}
      </div>

      <div class="weekly-claim__review">
        <div>
          <h3>Interpretation</h3>
          <p>${escapeHtml(claim.interpretation)}</p>
        </div>
        <details class="weekly-claim__details">
          <summary>Counterevidence and limitations</summary>
          <p>${escapeHtml(claim.counterevidence)}</p>
        </details>
        <div>
          <h3>What would change this view?</h3>
          <p>${escapeHtml(claim.what_would_change)}</p>
        </div>
        ${renderSources(claim.evidence, sources)}
      </div>
    </article>`;
  };

  const normalizeAnalysis = (analysis) => {
    if (Array.isArray(analysis.tabs) || !Array.isArray(analysis.parts)) return analysis;

    return {
      ...analysis,
      period: { current: analysis.week, previous: analysis.previous_week },
      synthesis: "New AI tools are reaching more workflows, while evidence of broader productivity and hiring effects remains mixed.",
      methodology_note: analysis.scope_note,
      sources: Object.entries(analysis.sources || {}).map(([id, source]) => ({
        ...source,
        id,
        name: source.name || source.label
      })),
      tabs: analysis.parts.map((part) => ({
        id: part.id,
        label: part.label,
        claims: (part.findings || []).map((finding) => ({
          claim: finding.title,
          confidence: finding.confidence,
          interpretation: finding.interpretation,
          horizons: Object.entries(finding.horizons || {}).map(([label, text]) => ({ label, text })),
          counterevidence: finding.counterevidence,
          what_would_change: finding.change_condition,
          evidence: finding.sources
        }))
      }))
    };
  };

  const renderAnalysis = (analysis) => {
    analysis = normalizeAnalysis(analysis);
    const sources = sourceMap(analysis);
    const currentPeriod = periodLabel(analysis.period?.current);
    const visibleTabs = analysis.tabs || [];

    document.title = `${analysis.title} · ${currentPeriod} | UGA LLM Lab`;
    mount.innerHTML = `
      <article class="weekly-analysis">
        <header class="weekly-analysis__header">
          <p class="weekly-analysis__eyebrow">UGA LLM Lab · WEEKLY IN-DEPTH ANALYSIS</p>
          <h1>${escapeHtml(analysis.title)}</h1>
          <p class="weekly-analysis__period">${escapeHtml(currentPeriod)}${analysis.updated ? ` · Updated ${escapeHtml(analysis.updated)}` : ""}</p>
          <p class="weekly-analysis__dek">${escapeHtml(analysis.synthesis)}</p>
        </header>

        ${analysis.structural_context ? `
          <section class="weekly-claim" aria-labelledby="weekly-structural-context">
            <h2 id="weekly-structural-context">Structural Context</h2>
            <p>${escapeHtml(analysis.structural_context.summary)}</p>
            ${(analysis.structural_context.points || []).map((point) => `
              <p>${escapeHtml(point.text)}</p>
              ${renderSources(point.evidence, sources)}`).join("")}
          </section>` : ""}

        <nav class="weekly-analysis__tabs" role="tablist" aria-label="Weekly in-depth analysis sections">
          ${visibleTabs.map((tab, index) => `
            <button type="button" role="tab" id="weekly-tab-${escapeHtml(tab.id)}" aria-controls="weekly-panel-${escapeHtml(tab.id)}" aria-selected="${index === 0}">${escapeHtml(tab.label)}</button>`).join("")}
        </nav>

        <div class="weekly-analysis__panels">
          ${visibleTabs.map((tab, index) => `
            <section role="tabpanel" id="weekly-panel-${escapeHtml(tab.id)}" aria-labelledby="weekly-tab-${escapeHtml(tab.id)}"${index === 0 ? "" : " hidden"}>
              ${(tab.claims || []).map((claim) => renderClaim(claim, sources)).join("")}
            </section>`).join("")}
        </div>

        <footer class="weekly-analysis__footer">
          <p>${escapeHtml(analysis.methodology_note || "Internal monitoring and the cited sources support this week's analysis.")}</p>
          <a href="ai-news.html">Return to AI/SI News <span aria-hidden="true">→</span></a>
        </footer>
      </article>`;

    const tabs = [...mount.querySelectorAll('[role="tab"]')];
    tabs.forEach((tab) => tab.addEventListener("click", () => {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute("aria-controls")).hidden = !selected;
      });
    }));

    tabs.forEach((tab, index) => {
      tab.tabIndex = index === 0 ? 0 : -1;
      tab.addEventListener("keydown", (event) => {
        const keys = { ArrowRight: (tabs.indexOf(tab) + 1) % tabs.length, ArrowLeft: (tabs.indexOf(tab) + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1 };
        if (!(event.key in keys)) return;
        event.preventDefault(); tabs[keys[event.key]].click(); tabs[keys[event.key]].focus();
      });
    });
    const requestedTab = new URLSearchParams(window.location.search).get("tab");
    const requestedButton = requestedTab && mount.querySelector(`#weekly-tab-${CSS.escape(requestedTab)}`);
    if (requestedButton) requestedButton.click();
  };

  const init = async () => {
    if (window.AI_WEEKLY_EMBEDDED) { renderAnalysis(window.AI_WEEKLY_EMBEDDED); return; }
    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get("week");
    const entry = analyses.find((item) => item.id === requestedId) || analyses[0];

    if (!entry) {
      mount.innerHTML = '<p class="ai-news-loading">No weekly in-depth analysis is available yet.</p>';
      return;
    }

    try {
      const response = await fetch(entry.data);
      if (!response.ok) throw new Error(`Unable to load ${entry.data}`);
      const analysis = await response.json();
      renderAnalysis(analysis);
    } catch (error) {
      console.error(error);
      mount.innerHTML = '<p class="ai-news-loading" role="alert">Weekly in-depth analysis could not be loaded. Please try again later.</p>';
    }
  };

  init();
})();
</script></html>
