name: Daily AI newsletter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, create a Brevo draft, or send after launch
        type: choice
        options: [preview, draft, send]
        default: preview
      date:
        description: Optional YYYY-MM-DD (older dates can only be previewed or drafted)
        type: string
        required: false
  schedule:
    - cron: '17 8 * * *'
      timezone: America/New_York
  pull_request:
    paths:
      - 'scripts/newsletter.mjs'
      - 'tests/daily-newsletter.test.mjs'
      - 'ai-news/newsletter-config.json'
      - 'assets/js/newsletter.js'
      - '.github/workflows/daily-newsletter.yml'

permissions:
  contents: read

# Share the weekly workflow's group so campaign mutations cannot overlap.
concurrency:
  group: weekly-ai-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test daily and weekly newsletter delivery
        run: node --test tests/*.test.mjs
      - name: Build daily preview without provider credentials
        env:
          NEWSLETTER_FREQUENCY: daily
          NEWSLETTER_MODE: preview
          NEWSLETTER_DATE: ${{ inputs.date }}
        run: node scripts/newsletter.mjs
      - name: Upload daily email preview
        uses: actions/upload-artifact@v4
        with:
          name: daily-newsletter-preview
          path: .newsletter-preview/daily/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Create daily draft or submit campaign
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'workflow_dispatch' && inputs.mode != 'preview' ||
           github.event_name == 'schedule' && vars.NEWSLETTER_DAILY_SENDING_ENABLED == 'true')
        env:
          NEWSLETTER_FREQUENCY: daily
          NEWSLETTER_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          NEWSLETTER_DATE: ${{ inputs.date }}
          NEWSLETTER_DAILY_SENDING_ENABLED: ${{ vars.NEWSLETTER_DAILY_SENDING_ENABLED }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_DAILY_LIST_ID: ${{ vars.BREVO_DAILY_LIST_ID }}
          NEWSLETTER_SENDER_EMAIL: ${{ vars.NEWSLETTER_SENDER_EMAIL }}
          NEWSLETTER_REPLY_TO: ${{ vars.NEWSLETTER_REPLY_TO }}
        run: node scripts/newsletter.mjs
