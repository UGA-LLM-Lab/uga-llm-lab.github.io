<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI/SI news, research developments, and weekly in-depth analysis from the UGA LLM Lab.">
  <title>AI/SI News | UGA LLM Lab</title>
  <link rel="icon" href="assets/images/lab-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="ai-news/catalog.js" defer></script>
  <script src="ai-news/trending.js" defer></script>
  <script src="ai-news/news.js" defer></script>
  <script src="assets/js/newsletter.js" defer></script>
</head>
<body data-page="ai-news">
  <div data-site-header></div>
  <main id="main-content" class="ai-news-page">
    <div class="shell" data-ai-news-index>
      <p class="ai-news-loading" role="status">Loading AI/SI news...</p>
    </div>
    <section class="shell newsletter" aria-labelledby="newsletter-title" data-newsletter>
      <p class="newsletter__eyebrow">THE WEEK IN AI</p>
      <h2 id="newsletter-title">Get weekly AI news from UGA LLM Lab</h2>
      <p data-newsletter-description>Research highlights, industry developments, and our latest weekly analysis, delivered to your inbox.</p>
      <p class="newsletter__status" data-newsletter-status>Email subscriptions are coming soon. For now, explore our weekly reports above.</p>
      <div data-newsletter-form></div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
